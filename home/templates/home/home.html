{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>
    {% include 'registration/_navigation.html' %}
    <h1>{{ title }}</h1>
    {% if show_message %}
        <p>{{ message }}</p>
    {% endif %}
    {% if user.is_staff %}
        <p><a href="{% url 'student_list' %}">Open Staff Dashboard</a></p>
    {% else %}
        <p><a href="{% url 'login' %}">Staff Login</a></p>
    {% endif %}
    <a href="{% url 'landing' %}">Back to Landing Page</a>
</body>
</html>
