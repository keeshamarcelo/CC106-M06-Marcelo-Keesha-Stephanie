<nav class="site-nav" aria-label="Main navigation">
    <a href="{% url 'landing' %}">Landing</a>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'student_registration' %}">Registration</a>
    <a href="{% url 'student_list' %}">Student Directory</a>
    {% if user.is_staff %}
        <a href="{% url 'staff_dashboard' %}">Dashboard</a>
        <a href="{% url 'student_list' %}">Student Directory</a>
        <span>Staff: {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Staff Logout</button>
        </form>
    {% else %}
        <a href="{% url 'staff_login' %}">Staff Login</a>
    {% endif %}
</nav>
